# Render Blueprint Specification for Inventory Manager Backend
# Docs: https://render.com/docs/blueprint-spec

services:
  - type: web
    name: inventory-api
    runtime: node
    rootDir: server
    plan: free
    region: oregon
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DB_NAME
        value: inventory
      - key: MONGODB_URI
        sync: false
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_PASSWORD
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: ACCESS_PIN
        sync: false
      - key: FRONTEND_ORIGIN
        sync: false
